version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_RXNORM_API_BASE_URL=${NEXT_PUBLIC_RXNORM_API_BASE_URL:-https://rxnav.nlm.nih.gov/REST}
        - NEXT_PUBLIC_OPENFDA_API_BASE_URL=${NEXT_PUBLIC_OPENFDA_API_BASE_URL:-https://api.fda.gov/drug}
        - NEXT_PUBLIC_DAILYMED_API_BASE_URL=${NEXT_PUBLIC_DAILYMED_API_BASE_URL:-https://dailymed.nlm.nih.gov/dailymed/services/v2}
        - NEXT_PUBLIC_API_RXNORM_TIMEOUT=${NEXT_PUBLIC_API_RXNORM_TIMEOUT:-30000}
        - NEXT_PUBLIC_API_OPENFDA_TIMEOUT=${NEXT_PUBLIC_API_OPENFDA_TIMEOUT:-30000}
        - NEXT_PUBLIC_API_DAILYMED_TIMEOUT=${NEXT_PUBLIC_API_DAILYMED_TIMEOUT:-30000}
        - NEXT_PUBLIC_ENABLE_API_LOGGING=${NEXT_PUBLIC_ENABLE_API_LOGGING:-false}
        - NEXT_PUBLIC_MAX_RETRIES=${NEXT_PUBLIC_MAX_RETRIES:-3}
        - NEXT_PUBLIC_RETRY_DELAY=${NEXT_PUBLIC_RETRY_DELAY:-1000}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add nginx reverse proxy for production
  # nginx:
